<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1d2b16">
<title>Rota de Defesa</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1d2b16; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; }
  #rotate { display: none; position: fixed; inset: 0; background: #1d2b16; color: #f3ead2;
    font: 600 20px system-ui, sans-serif; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="rotate">Gire o celular para a horizontal ↻</div>
<script src="game.js"></script>
</body>
</html>
