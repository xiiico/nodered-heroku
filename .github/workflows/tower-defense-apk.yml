name: Rota de Defesa — APK

on:
  push:
    paths:
      - 'tower-defense/**'
      - '.github/workflows/tower-defense-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tower-defense
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm ci

      - name: Gerar projeto Android
        run: npx cap add android

      - name: Travar orientação em paisagem
        run: |
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/' \
            android/app/src/main/AndroidManifest.xml

      - name: Sincronizar assets
        run: npx cap sync android

      - name: Compilar APK (debug)
        working-directory: tower-defense/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: rota-de-defesa-apk
          path: tower-defense/android/app/build/outputs/apk/debug/app-debug.apk
